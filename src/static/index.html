<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Калькулятор</h1>
  <input id="a" type="text" placeholder="Первое число">
  <select id="op">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
    <option value="**">**</option>
  </select>
  <input id="b" type="text" placeholder="Второе число">
  <button id="calc">Посчитать</button>
  <div id="result"></div>
  <script src="/script.js"></script>
</body>
</html>
